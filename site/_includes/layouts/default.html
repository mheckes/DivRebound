<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if title %}{{ title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ description | default: site.description }}">
  <meta property="og:title" content="{% if title %}{{ title }} · {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ description | default: site.description }}">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/svg+xml" href="/assets/img/logo.svg">
  <link rel="stylesheet" href="/assets/css/tokens.css?v={{ assetVersion }}">
  <link rel="stylesheet" href="/assets/css/site.css?v={{ assetVersion }}">
</head>
<body>
  {% include "header.html" %}
  <main>
    {{ content }}
  </main>
  {% include "footer.html" %}
  <script src="/assets/js/site.js?v={{ assetVersion }}" defer></script>
</body>
</html>
