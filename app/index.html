    <style>
      /* Nur für die eigenständige Auslieferung (index.html) - beim späteren
         Einbetten in eine fremde Seite kommt kein eigenes index.html/body
         zum Einsatz, daher hier bewusst kein globaler Reset in den
         wiederverwendbaren CSS-Dateien unter src/style. Ohne das erzeugt
         der Standard-Browser-Rand auf <body> (8px) zusammen mit
         100vh-Höhe im App-Shell einen unnötigen Scrollbalken. */
      body {
        margin: 0;
      }
    </style>
